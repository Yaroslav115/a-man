[project]
name = "a-man"
version = "0.0.0"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = [
    "components/ui/voice-transcriber/api",
    "components/ui/voice-transcriber/database",
    "components/ui/voice-transcriber/task-worker",
    "components/ui/voice-transcriber/transcription-engines/python-whisper",
]
testpaths = [
    "tests",
    "components",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: fast tests isolated from external services",
    "integration: tests involving multiple modules or external services",
    "e2e: complete user or system workflows",
    "slow: tests that are expensive or take substantial time",
    "requires_gpu: tests that require compatible GPU hardware",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
mypy_path = [
    "components/ui/voice-transcriber/database",
    "components/ui/voice-transcriber/transcription-engines/python-whisper",
]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["worker_app.tasks.transcribe"]
disallow_untyped_decorators = false
