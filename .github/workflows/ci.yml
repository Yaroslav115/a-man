name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check linting
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check types
        run: >-
          python -m mypy
          main.py
          tests
          components/ui/voice-transcriber/transcription-engines/python-whisper/a_man_whisper
          components/ui/voice-transcriber/transcription-engines/python-whisper/tests

  pytest:
    name: Pytest and Whisper integration
    runs-on: ubuntu-latest
    needs:
      - ruff
      - mypy
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-whisper.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-whisper.txt

      - name: Cache Whisper model
        uses: actions/cache@v5
        with:
          path: ~/.cache/whisper
          key: whisper-${{ runner.os }}-small

      - name: Run tests
        env:
          RUN_WHISPER_INTEGRATION: "1"
          WHISPER_MODEL: small
        run: >-
          python main.py
          -m "not requires_gpu"
          --junitxml=report.xml
          --cov=main
          --cov=a_man_whisper
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 7
