# A pipeline is created for branch pushes, merge requests, and version tags.
# The second rule prevents duplicate branch + merge-request pipelines.
workflow:
  name: "A-Man · $CI_PIPELINE_SOURCE · $CI_COMMIT_REF_NAME"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

# Stages are sequential. Jobs inside one stage can run in parallel.
stages:
  - validate
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# These defaults are copied into each job unless that job overrides them.
default:
  image: python:3.12-slim
  interruptible: true
  before_script:
    - python --version
    - python -m pip install -r requirements-dev.txt
  cache:
    key:
      files:
        - requirements-dev.txt
    paths:
      - .cache/pip/
    policy: pull-push

# Both validation jobs start immediately and run in parallel.
ruff:
  stage: validate
  needs: []
  script:
    - python -m ruff check .
    - python -m ruff format --check .

mypy:
  stage: validate
  needs: []
  script:
    - python -m mypy main.py tests

# Tests start only after both validation jobs succeed.
pytest:
  stage: test
  needs:
    - ruff
    - mypy
  script:
    - >-
      python main.py
      --junitxml=report.xml
      --cov=main
      --cov-branch
      --cov-report=term-missing
      --cov-report=xml:coverage.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

